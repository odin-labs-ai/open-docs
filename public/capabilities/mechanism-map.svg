<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Odin capability mechanisms</title>
<desc id="desc">Annotation supplies pointed-at evidence; memory supplies grounded context. Goals and sessions carry intent and continuity; skills and swarm support work. Next adds premise checks and durable workflows. Intelligence Systems observe sources and learn from supported outcomes. Media and artifacts carry usable results to verification. This is a concept map, not a connected deployment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#91cbb3"/></marker></defs>
<rect width="960" height="560" rx="12" fill="#101b22"/>
<g font-family="Arial,sans-serif" fill="#e4f5ed"><text x="36" y="48" font-size="27">From intent to evidence</text><text x="36" y="78" font-size="16" fill="#a1b7c3">A relationship map · distinct mechanisms · no connected deployment implied</text></g>
<g stroke="#91cbb3" stroke-width="2" fill="none" marker-end="url(#arrow)">
