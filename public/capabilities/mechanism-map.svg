<g transform="translate(354 262)"><rect width="240" height="80" rx="6" fill="#182a32" stroke="#405b67"/><text x="18" y="32" fill="#e4f5ed" font-size="19">Skills</text><text x="18" y="59" fill="#c2d3da" font-size="15">Loaded and allowed instructions</text></g>
