<g transform="translate(674 122)"><rect width="250" height="110" rx="6" fill="#182a32" stroke="#405b67"/><text x="18" y="34" fill="#e4f5ed" font-size="19">Media and artifacts</text><text x="18" y="65" fill="#c2d3da" font-size="15">Usable persisted results</text><text x="18" y="90" fill="#c2d3da" font-size="15">Reopen and verify the output</text></g>
<g transform="translate(674 262)"><rect width="250" height="80" rx="6" fill="#182a32" stroke="#405b67"/><text x="18" y="32" fill="#e4f5ed" font-size="19">Intelligence Systems</text><text x="18" y="59" fill="#c2d3da" font-size="15">Sources, signals, supported learning</text></g>
